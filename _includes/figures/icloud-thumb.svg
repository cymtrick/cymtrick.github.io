<svg class="diagram" viewBox="0 0 400 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A javascript: link in a note, split into comment, line break and code">
  <defs><marker id="ict" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker></defs>
  <rect class="box" x="20" y="22" width="360" height="56" rx="6"/>
  <text class="small muted" x="34" y="42">iCloud Notes</text>
  <text class="mono" x="34" y="64" style="fill:var(--link);text-decoration:underline">javascript://%0D%0Aalert(…)</text>
  <g style="color:var(--accent)"><line class="arrow-accent" x1="200" y1="78" x2="200" y2="112" marker-end="url(#ict)"/></g>
  <rect class="box-accent" x="80" y="114" width="240" height="48" rx="6"/>
  <text class="small" x="200" y="134" text-anchor="middle" style="fill:var(--accent-ink);font-weight:600">www.icloud.com</text>
