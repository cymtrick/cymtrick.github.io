<svg class="diagram" viewBox="0 0 400 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A forged POST without fb_dtsg still returns 200 OK">
  <defs><marker id="cst" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker></defs>
  <rect class="box-accent" x="15" y="30" width="150" height="56" rx="6"/>
  <text class="small" x="90" y="54" text-anchor="middle" style="fill:var(--accent-ink);font-weight:600">attacker's page</text>
  <text class="small" x="90" y="72" text-anchor="middle" style="fill:var(--accent-ink)">forged POST</text>
  <g style="color:var(--accent)"><line class="arrow-accent" x1="165" y1="58" x2="226" y2="58" marker-end="url(#cst)"/></g>
  <text class="mono" x="196" y="48" text-anchor="middle" style="font-size:10px;fill:var(--ink-3);text-decoration:line-through">fb_dtsg</text>
  <rect class="box-ink" x="230" y="30" width="155" height="56" rx="6"/>
  <text class="on-ink small" x="307" y="54" text-anchor="middle">partners.</text>
  <text class="on-ink small" x="307" y="70" text-anchor="middle">facebook.com</text>
  <rect class="box-accent" x="230" y="112" width="155" height="40" rx="6"/>
  <text class="mono" x="307" y="137" text-anchor="middle" style="fill:var(--accent-ink);font-weight:600">200 OK</text>
  <g style="color:var(--accent)"><line class="arrow-accent" x1="307" y1="86" x2="307" y2="108" marker-end="url(#cst)"/></g>
  <text class="small muted" x="20" y="137">no CSRF check</text>
</svg>
