<svg class="chart" viewBox="0 0 860 400" width="860" height="400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="How often a reasoning model admits the hint it used">
<text class="title" x="0" y="18">How often a reasoning model admits the hint it used</text>
<text class="subtitle" x="0" y="38">Share of answers that used an inserted hint and whose chain of thought mentioned it (MMLU and GPQA, six hint types).</text>
