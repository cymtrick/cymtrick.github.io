<svg class="diagram" viewBox="0 0 860 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Black-box privatization: sample datasets from the data distribution, run the algorithm on each, estimate how much its output varies, calibrate Gaussian noise to that variation, release the noisy output.">
  <defs>
    <marker id="pah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker>
  </defs>
  <!-- top row: simulation -->
  <text x="0" y="18" style="font-weight:600">Measure: how much does the output move when the data changes?</text>
  <g transform="translate(0,34)">
    <rect class="box" x="0" y="0" width="150" height="70" rx="6"/>
    <text x="75" y="28" text-anchor="middle">data distribution 𝒟</text>
    <text class="small muted" x="75" y="48" text-anchor="middle">or random halves of X</text>
    <line class="arrow" x1="150" y1="35" x2="196" y2="35" marker-end="url(#pah)" style="color:var(--ink-2)"/>
    <text class="small muted" x="173" y="52" text-anchor="middle">sample</text>
    <rect class="box" x="200" y="0" width="150" height="70" rx="6"/>
    <text x="275" y="24" text-anchor="middle">X⁽¹⁾, X⁽²⁾, …, X⁽ᵐ⁾</text>
    <text class="small muted" x="275" y="46" text-anchor="middle">m simulated datasets</text>
    <line class="arrow" x1="350" y1="35" x2="396" y2="35" marker-end="url(#pah)" style="color:var(--ink-2)"/>
    <text class="small muted" x="373" y="52" text-anchor="middle">run ℱ</text>
    <rect class="box-ink" x="400" y="0" width="150" height="70" rx="6"/>
    <text x="475" y="30" text-anchor="middle" class="on-ink">black-box ℱ</text>
    <text class="small on-ink" x="475" y="50" text-anchor="middle" style="opacity:.8">any algorithm, no proofs</text>
    <line class="arrow" x1="550" y1="35" x2="596" y2="35" marker-end="url(#pah)" style="color:var(--ink-2)"/>
    <rect class="box" x="600" y="0" width="150" height="70" rx="6"/>
    <text x="675" y="24" text-anchor="middle">ℱ(X⁽¹⁾), …, ℱ(X⁽ᵐ⁾)</text>
    <text class="small muted" x="675" y="46" text-anchor="middle">canonicalised outputs</text>
    <line class="arrow" x1="675" y1="70" x2="675" y2="116" marker-end="url(#pah)" style="color:var(--ink-2)"/>
    <text class="small muted" x="684" y="98">estimate</text>
  </g>
  <!-- bottom row: calibration and release -->
  <g transform="translate(0,154)">
    <rect class="box-accent" x="600" y="0" width="150" height="70" rx="6"/>
    <text x="675" y="28" text-anchor="middle">covariance Σ̂</text>
    <text class="small muted" x="675" y="48" text-anchor="middle">or per-axis variances</text>
    <line class="arrow" x1="600" y1="35" x2="554" y2="35" marker-end="url(#pah)" style="color:var(--ink-2)"/>
    <text class="small muted" x="577" y="52" text-anchor="middle">calibrate</text>
    <rect class="box-accent" x="400" y="0" width="150" height="70" rx="6"/>
    <text x="475" y="24" text-anchor="middle">Gaussian noise B</text>
    <text class="small mono" x="475" y="48" text-anchor="middle">MI ≤ ½ log det(·) ≤ β</text>
    <line class="arrow" x1="400" y1="35" x2="354" y2="35" marker-end="url(#pah)" style="color:var(--ink-2)"/>
    <rect class="box" x="200" y="0" width="150" height="70" rx="6"/>
    <text x="275" y="28" text-anchor="middle">release ℱ(X) + B</text>
    <text class="small muted" x="275" y="48" text-anchor="middle">on the real data, once</text>
    <line class="arrow" x1="200" y1="35" x2="154" y2="35" marker-end="url(#pah)" style="color:var(--ink-2)"/>
    <rect class="box" x="0" y="0" width="150" height="70" rx="6"/>
    <text x="75" y="24" text-anchor="middle">guarantee</text>
    <text class="small mono" x="75" y="48" text-anchor="middle">MI(X; output) ≤ β</text>
  </g>
  <text class="small muted" x="0" y="268">Noise is shaped to the output's measured spread: large where ℱ already varies, small where it is stable.</text>
  <text class="small muted" x="0" y="286">Posterior advantage of any adversary, however powerful, is then at most √(β/2).</text>
</svg>
