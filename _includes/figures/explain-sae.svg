<svg class="chart" viewBox="0 0 860 380" width="860" height="380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bigger dictionaries, more dead features">
<text class="title" x="0" y="18">Bigger dictionaries, more dead features</text>
<text class="subtitle" x="0" y="38">Sparse autoencoders on the residual stream of Claude 3 Sonnet: fraction of learned features that never fire, by dictionary size.</text>
<g class="grid">
<line x1="56" x2="796" y1="308.0" y2="308.0"/>
<line x1="56" x2="796" y1="250.5" y2="250.5"/>
<line x1="56" x2="796" y1="193.0" y2="193.0"/>
<line x1="56" x2="796" y1="135.5" y2="135.5"/>
<line x1="56" x2="796" y1="78.0" y2="78.0"/>
</g><g class="axis">
<text x="48" y="312.0" text-anchor="end">0%</text>
<text x="48" y="254.5" text-anchor="end">20%</text>
<text x="48" y="197.0" text-anchor="end">40%</text>
<text x="48" y="139.5" text-anchor="end">60%</text>
<text x="48" y="82.0" text-anchor="end">80%</text>
</g>
<text class="axis-title" x="56" y="70" text-anchor="start">Dead features (%)</text>
<g class="axis">
<line x1="56" x2="796" y1="308.0" y2="308.0"/>
<text x="56.0" y="326.0" text-anchor="middle">1M</text>
<text x="352.0" y="326.0" text-anchor="middle">4M</text>
<text x="796.0" y="326.0" text-anchor="middle">34M</text>
</g>
<text class="axis-title" x="796" y="344.0" text-anchor="end">Dictionary size (features)</text>
<g class="s1">
<path class="line" d="M56.0,302.2 L352.0,207.4 L796.0,121.1"/>
<circle class="dot" cx="56.0" cy="302.2" r="4" data-tip="<b>Dead features</b><br>1M: 2%"/>
<circle class="dot" cx="352.0" cy="207.4" r="4" data-tip="<b>Dead features</b><br>4M: 35%"/>
<circle class="dot" cx="796.0" cy="121.1" r="4" data-tip="<b>Dead features</b><br>34M: 65%"/>
</g>
<text class="label" x="804.0" y="125.1">65%</text>
<text class="subtitle" x="0" y="374">Source: Templeton, Conerly, Marcus et al. (Anthropic), Scaling Monosemanticity, 2024</text>
</svg>
