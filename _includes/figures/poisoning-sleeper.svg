<svg class="chart" viewBox="0 0 860 420" width="860" height="420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A backdoor that survives safety training">
<text class="title" x="0" y="18">A backdoor that survives safety training</text>
<text class="subtitle" x="0" y="38">Rate of vulnerable code written by a backdoored model, by year in the prompt, before and after supervised fine-tuning (SFT) and RL</text>
<text class="subtitle" x="0" y="56">safety training.</text>
<g class="legend s6"><rect class="swatch" x="0" y="73" width="12" height="12" rx="2"/><text x="18" y="84">Prompt says 2023 (no trigger)</text></g>
<g class="legend s1"><rect class="swatch" x="244.10000000000002" y="73" width="12" height="12" rx="2"/><text x="262.1" y="84">Prompt says 2024 (trigger)</text></g>
