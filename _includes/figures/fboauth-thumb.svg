<svg class="diagram" viewBox="0 0 400 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="facebook.com redirects an access token to fbTARGET://, and iOS delivers it to a malicious app">
  <defs><marker id="fbt" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker></defs>
  <rect class="box" x="10" y="20" width="120" height="44" rx="5"/>
  <text class="small" x="70" y="46" text-anchor="middle">facebook.com</text>
  <rect class="box" x="140" y="20" width="250" height="44" rx="5"/>
  <text class="mono" x="265" y="47" text-anchor="middle">fbTARGET://#access_token</text>
  <g style="color:var(--accent)">
    <line class="arrow-accent" x1="265" y1="64" x2="265" y2="96" marker-end="url(#fbt)"/>
    <line class="arrow-accent" x1="130" y1="42" x2="136" y2="42" marker-end="url(#fbt)"/>
  </g>
  <rect class="box" x="175" y="98" width="180" height="30" rx="5"/>
  <text class="small" x="265" y="117" text-anchor="middle">iOS URL scheme routing</text>
  <g style="color:var(--accent)"><line class="arrow-accent" x1="265" y1="128" x2="265" y2="140" marker-end="url(#fbt)"/></g>
  <rect class="box-accent" x="190" y="142" width="150" height="32" rx="5"/>
  <text class="small" x="265" y="162" text-anchor="middle" style="fill:var(--accent-ink);font-weight:600">malicious app</text>
  <rect class="ghost" x="30" y="142" width="130" height="32" rx="5" style="fill:none;stroke:var(--rule-strong);stroke-dasharray:4 4"/>
  <text class="small muted" x="95" y="162" text-anchor="middle">real app: not installed</text>
</svg>
