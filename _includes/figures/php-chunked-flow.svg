<svg class="diagram" viewBox="0 0 860 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The bug. A request with Transfer-Encoding: chunked and a Content-Length larger than needed reaches Apache. Apache's ap_http_filter throws an error instead of letting PHP read the input. During shutdown, PHP's Apache handler in sapi_apache2.c inserts the end-of-stream bucket into the existing brigade, and the request body appears in the response.">
  <defs><marker id="phf" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker></defs>
  <style>.diagram .m11 { font-family: var(--mono); font-size: 11px; }</style>
  <rect class="box-accent" x="10" y="20" width="190" height="110" rx="6"/>
  <text x="22" y="42" style="font-weight:600;fill:var(--accent-ink)">Request</text>
  <text class="m11" x="22" y="64" style="fill:var(--accent-ink)">Transfer-Encoding:</text>
  <text class="m11" x="22" y="78" style="fill:var(--accent-ink)">  chunked</text>
  <text class="m11" x="22" y="98" style="fill:var(--accent-ink)">Content-Length:</text>
  <text class="m11" x="22" y="112" style="fill:var(--accent-ink)">  more than needed</text>
  <g style="color:var(--ink-2)"><line class="arrow" x1="200" y1="75" x2="226" y2="75" marker-end="url(#phf)"/></g>
  <rect class="box" x="230" y="20" width="190" height="110" rx="6"/>
  <text x="242" y="42" style="font-weight:600">Apache</text>
  <text class="m11" x="242" y="64" style="fill:var(--ink)">ap_http_filter</text>
  <text class="small muted" x="242" y="84">throws an error instead of</text>
  <text class="small muted" x="242" y="100">letting PHP read the input;</text>
  <text class="small muted" x="242" y="116">the input sits in a brigade</text>
  <g style="color:var(--ink-2)"><line class="arrow" x1="420" y1="75" x2="446" y2="75" marker-end="url(#phf)"/></g>
  <rect class="box" x="450" y="20" width="190" height="110" rx="6"/>
  <text x="462" y="42" style="font-weight:600">PHP's Apache handler</text>
  <text class="m11" x="462" y="64" style="fill:var(--ink)">sapi_apache2.c</text>
  <text class="small muted" x="462" y="84">at shutdown, appends the</text>
  <text class="small muted" x="462" y="100">end-of-stream bucket to the</text>
  <text class="small" x="462" y="116" style="fill:var(--accent-ink);font-weight:600">existing brigade</text>
  <g style="color:var(--accent)"><line class="arrow-accent" x1="640" y1="75" x2="666" y2="75" marker-end="url(#phf)"/></g>
  <rect class="box-ink" x="670" y="20" width="180" height="110" rx="6"/>
  <text class="on-ink" x="682" y="42" style="font-weight:600">Response</text>
  <text class="on-ink small" x="682" y="66">the request body</text>
  <text class="on-ink small" x="682" y="82">"mysteriously appears"</text>
  <text class="on-ink small" x="682" y="98">in the response body</text>
  <text class="small muted" x="10" y="160">The input ends up in Apache's bucket brigade even though PHP never sent it there.</text>
  <text class="small muted" x="10" y="178">PHP never even sees it: Apache doesn't let it read the input. The leak is in which brigade the final bucket goes into.</text>
</svg>
