<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="site-logo" href="{{ '/' | relative_url }}">Adversarial<span>/</span>Minds</a>
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}">Posts</a>
      <a href="{{ '/about' | relative_url }}">About</a>
    </nav>
  </header>

  {{ content }}

  <footer class="site-footer">
    <p>© {{ 'now' | date: '%Y' }} Adversarial Minds </p>
  </footer>
</body>
</html>
