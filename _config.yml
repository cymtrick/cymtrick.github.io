title: "Adversarial Minds"
tagline: "Notes on secure and trustworthy machine learning"
description: "Long-form notes on adversarial machine learning, privacy, certified robustness, explainability, jailbreaking and fairness — every claim sourced, every chart drawn from the papers."
author: "P. Rajan"
baseurl: ""
url: "https://cymtrick.github.io"
theme: null
lang: en

markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - tools
  - vendor
  - node_modules
