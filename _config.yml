title: "Prashanth Varma (cymtrick) blog"
tagline: "Security, bugs, and how systems break"
description: "Prashanth Varma's blog: write-ups of bugs I've found, web and application security, and a series on the security of machine learning."
author: "Prashanth Varma Dommaraju"
baseurl: ""
url: "https://cymtrick.github.io"
theme: null
lang: en

markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - tools
  - vendor
  - node_modules
