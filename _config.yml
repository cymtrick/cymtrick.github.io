title: "Adversarial Minds"
description: "Notes on secure and trustworthy machine learning — attacks, defenses, and everything in between."
author: "P. Rajan"
baseurl: ""
url: "https://cymtrick.github.io"
theme: null

markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

collections:
  posts:
    output: true

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
